# =============================================================================
# Project : Quantum Computing Course
# Author  : Dr. Ceasar Jackson Jr.
# File    : .github/workflows/ci.yml
#
# Purpose
#   On every push and pull request to main, install the pinned requirements and
#   run the course's own suite: the standards audit plus every lab and exercise
#   EXCEPT the ones listed as slow in labs/run_all.py (those still run locally).
#
# Security
#   * No secrets are used or needed. The hardware labs (11, 15, 17, 44, 46, 48)
#     run in their default DRY-RUN mode on a simulated device, so no IBM key
#     and no network call to IBM is ever made here.
#   * The workflow token is read-only (permissions: contents: read).
#
# Exit status
#   The job fails if run_all.py reports any failed script or check.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the job only reads the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  labs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13 (the version the course is tested with)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the pinned requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Standards audit, labs and exercises (slow scripts skipped)
        # run_all.py runs check_standards.py first, then every lab and exercise.
        run: python labs/run_all.py --skip-slow --timeout 600

      - name: Keep the logs if anything failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: course-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
